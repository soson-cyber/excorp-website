  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>일반 웨비나 화면 4개의 배치 도식</title>
  <desc>서로 다른 기업의 웨비나 화면 4개를 도식으로 옮겼다. 발표자료 내용은 모두 다르지만, 네 화면 모두 발표자 창과 발표자료가 나뉜 같은 배치다. 제목, 로고, 이름 자막, 방송사 로고의 자리도 비슷하다.</desc>
  <style>
    svg{ --bg:#0e0626; --screen:#161232; --hair:#2b2752; --band:#1f1a45;
      --n1:#4b4580; --n2:#37325f; --mint:#45f1e0; --lav:#c4b5fd; }
    .screen{ fill:var(--screen); stroke:var(--hair); stroke-width:1 }
    .band{ fill:var(--band) }
    .n1{ fill:var(--n1) }
    .n2{ fill:var(--n2) }
    .slide{ fill:rgba(196,181,253,0.07); stroke:var(--lav); stroke-width:2.5 }
    .sk{ fill:rgba(196,181,253,0.26) }
    .spk{ fill:rgba(69,241,224,0.08) }
    .spk-line{ fill:none; stroke:var(--mint); stroke-width:2.5 }
    .person{ fill:rgba(69,241,224,0.34) }
    .lab{ font-size:13px; font-weight:600 }
    .lab-lav{ fill:var(--lav) }
    .lab-mint{ fill:var(--mint) }
  </style>
